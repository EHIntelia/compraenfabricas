<!doctype html><html lang='es'><head><meta charset='utf-8'><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#F97316;--n6:#EA580C;--n7:#C2410C;--n9:#9A3412;--tinta:#1A1A1A;--gris:#6B6B6B;
--durazno:#FFEDD5;--crema:#FFF8F5;--borde:#D9CFC7;--grad:linear-gradient(90deg,#F97316,#EA580C)}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:Arial,"Liberation Sans",Helvetica,sans-serif;color:var(--tinta);background:var(--crema)}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{display:inline-block;background:var(--grad);color:#fff;font-weight:700;letter-spacing:.08em;
text-transform:uppercase;border-radius:999px}
.badge.soft{background:var(--durazno);color:var(--n7)}
.flag{width:1.15em;height:.77em;border-radius:3px;vertical-align:-.04em;margin-left:.2em}
.photo{background-size:auto 100%;background-position:center;background-repeat:no-repeat;background-color:#3a3a3a}
.logo{display:block}
h1{font-weight:900;letter-spacing:-.02em;line-height:1.05}
.foot{position:absolute;left:0;right:0;bottom:0;background:var(--tinta);color:#fff;display:flex;
align-items:center;justify-content:space-between;padding:0 64px;font-size:26px}
.foot b{color:#FDBA74}
.pill{background:var(--grad);color:#fff;font-weight:700;border-radius:999px;box-shadow:0 8px 24px rgba(234,88,12,.3)}

html,body{width:1080px;height:1350px}
.num{position:absolute;right:56px;top:56px;font-size:22px;font-weight:700;color:var(--gris);letter-spacing:.08em}
.lg{position:absolute;left:56px;top:48px;height:50px}
.swipe{position:absolute;right:56px;bottom:52px;font-size:26px;font-weight:700;color:var(--n7)}
.eyebrow{font-size:24px;font-weight:700;letter-spacing:.08em;color:var(--n7);text-transform:uppercase}

.b{position:absolute;left:64px;top:150px;width:952px}
.b h1{font-size:88px;letter-spacing:-.035em;line-height:1.02}
.list{position:absolute;left:64px;right:64px;top:560px;display:flex;flex-direction:column;gap:72px}
.r{display:flex;flex-direction:column;align-items:flex-start}
.x{font-size:70px;font-weight:700;color:var(--tinta);position:relative;letter-spacing:-.02em;line-height:1.1}
.sc{position:absolute;left:-14px;right:-14px;top:22%;width:calc(100% + 28px);height:60%}
.tag{margin:14px 0 0 120px;background:var(--grad);color:#fff;font-weight:900;font-size:34px;padding:12px 24px;border-radius:12px;
box-shadow:0 8px 24px rgba(234,88,12,.28)}
</style></head><body><div class='num'>1/8</div><img class='lg' src='fotos/logo-horizontal.png'><div class='swipe'>Desliza →</div><div class='b'><h1>Ya no tienes <span class='grad'>excusa</span> para empezar tu negocio.</h1></div><div class='list'><div class='r'><div class='x'>“No tengo capital”<svg class='sc' viewBox='0 0 600 60' preserveAspectRatio='none'><path d='M6 38 C 120 18, 240 46, 360 26 S 540 30, 594 20' stroke='#EA580C' stroke-width='14' fill='none' stroke-linecap='round'/><path d='M14 26 C 160 44, 300 14, 440 36 S 560 30, 590 34' stroke='#F97316' stroke-width='9' fill='none' stroke-linecap='round' opacity='.85'/></svg></div><div class='tag' style='transform:rotate(-3deg)'>10 piezas desde $1,574</div></div><div class='r'><div class='x'>“Importar es complicado”<svg class='sc' viewBox='0 0 600 60' preserveAspectRatio='none'><path d='M6 38 C 120 18, 240 46, 360 26 S 540 30, 594 20' stroke='#EA580C' stroke-width='14' fill='none' stroke-linecap='round'/><path d='M14 26 C 160 44, 300 14, 440 36 S 560 30, 590 34' stroke='#F97316' stroke-width='9' fill='none' stroke-linecap='round' opacity='.85'/></svg></div><div class='tag' style='transform:rotate(2.5deg)'>Ya están en México</div></div><div class='r'><div class='x'>“Tarda meses en llegar”<svg class='sc' viewBox='0 0 600 60' preserveAspectRatio='none'><path d='M6 38 C 120 18, 240 46, 360 26 S 540 30, 594 20' stroke='#EA580C' stroke-width='14' fill='none' stroke-linecap='round'/><path d='M14 26 C 160 44, 300 14, 440 36 S 560 30, 590 34' stroke='#F97316' stroke-width='9' fill='none' stroke-linecap='round' opacity='.85'/></svg></div><div class='tag' style='transform:rotate(-2deg)'>DHL al día hábil siguiente</div></div></div></body></html>
