<!doctype html><html lang='es'><head><meta charset='utf-8'><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#F97316;--n6:#EA580C;--n7:#C2410C;--n9:#9A3412;--tinta:#1A1A1A;--gris:#6B6B6B;
--durazno:#FFEDD5;--crema:#FFF8F5;--borde:#D9CFC7;--grad:linear-gradient(90deg,#F97316,#EA580C)}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:Arial,"Liberation Sans",Helvetica,sans-serif;color:var(--tinta);background:var(--crema)}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{display:inline-block;background:var(--grad);color:#fff;font-weight:700;letter-spacing:.08em;
text-transform:uppercase;border-radius:999px}
.badge.soft{background:var(--durazno);color:var(--n7)}
.flag{width:1.15em;height:.77em;border-radius:3px;vertical-align:-.04em;margin-left:.2em}
.photo{background-size:auto 100%;background-position:center;background-repeat:no-repeat;background-color:#3a3a3a}
.logo{display:block}
h1{font-weight:900;letter-spacing:-.02em;line-height:1.05}
.foot{position:absolute;left:0;right:0;bottom:0;background:var(--tinta);color:#fff;display:flex;
align-items:center;justify-content:space-between;padding:0 64px;font-size:26px}
.foot b{color:#FDBA74}
.pill{background:var(--grad);color:#fff;font-weight:700;border-radius:999px;box-shadow:0 8px 24px rgba(234,88,12,.3)}

html,body{width:1080px;height:1350px}
.num{position:absolute;right:56px;top:56px;font-size:22px;font-weight:700;color:var(--gris);letter-spacing:.08em}
.lg{position:absolute;left:56px;top:48px;height:50px}
.swipe{position:absolute;right:56px;bottom:52px;font-size:26px;font-weight:700;color:var(--n7)}
.eyebrow{font-size:24px;font-weight:700;letter-spacing:.08em;color:var(--n7);text-transform:uppercase}

.b{position:absolute;left:56px;top:150px;width:968px}
.b h1{font-size:104px;letter-spacing:-.035em;line-height:1.02}
.b p{font-size:36px;font-weight:700;margin-top:30px}
.b p span{color:var(--n6)}
.g{position:absolute;left:56px;right:56px;top:640px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.t{height:280px;border-radius:16px;position:relative;background-size:cover;box-shadow:0 6px 20px rgba(26,26,26,.12)}
.t span{position:absolute;left:12px;bottom:12px;background:#fff;border-radius:999px;padding:6px 14px;
font-weight:900;font-size:28px;color:var(--n6)}
.t small{font-size:16px;color:var(--gris);font-weight:400}
</style></head><body><div class='num'>1/8</div><img class='lg' src='fotos/logo-horizontal.png'><div class='swipe'>Desliza →</div><div class='b'><h1>Ya no tienes <span class='grad'>excusa</span> para no empezar tu negocio.</h1>
<p>10 piezas <span>·</span> Menos de $2,000 <span>·</span> Ya en México<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" fill="#DE2910"/><g fill="#FFDE00"><polygon points="5,2 6.2,5.6 10,5.6 6.9,7.8 8.1,11.4 5,9.2 1.9,11.4 3.1,7.8 0,5.6 3.8,5.6"/><circle cx="10" cy="2" r=".9"/><circle cx="12" cy="4" r=".9"/><circle cx="12" cy="7" r=".9"/><circle cx="10" cy="9" r=".9"/></g></svg></p></div>
<div class='g'><div class='photo t' style="background-image:url('fotos/CF-022.jpg')"><span>$157<small>/pieza</small></span></div><div class='photo t' style="background-image:url('fotos/CF-017.jpg')"><span>$173<small>/pieza</small></span></div><div class='photo t' style="background-image:url('fotos/CF-039.jpg')"><span>$184<small>/pieza</small></span></div><div class='photo t' style="background-image:url('fotos/CF-037.jpg')"><span>$288<small>/pieza</small></span></div><div class='photo t' style="background-image:url('fotos/CF-023.jpg')"><span>$319<small>/pieza</small></span></div><div class='photo t' style="background-image:url('fotos/CF-018.jpg')"><span>$338<small>/pieza</small></span></div></div></body></html>
