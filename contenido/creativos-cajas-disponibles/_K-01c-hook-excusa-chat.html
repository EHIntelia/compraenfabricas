<!doctype html><html lang='es'><head><meta charset='utf-8'><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#F97316;--n6:#EA580C;--n7:#C2410C;--n9:#9A3412;--tinta:#1A1A1A;--gris:#6B6B6B;
--durazno:#FFEDD5;--crema:#FFF8F5;--borde:#D9CFC7;--grad:linear-gradient(90deg,#F97316,#EA580C)}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:Arial,"Liberation Sans",Helvetica,sans-serif;color:var(--tinta);background:var(--crema)}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{display:inline-block;background:var(--grad);color:#fff;font-weight:700;letter-spacing:.08em;
text-transform:uppercase;border-radius:999px}
.badge.soft{background:var(--durazno);color:var(--n7)}
.flag{width:1.15em;height:.77em;border-radius:3px;vertical-align:-.04em;margin-left:.2em}
.photo{background-size:auto 100%;background-position:center;background-repeat:no-repeat;background-color:#3a3a3a}
.logo{display:block}
h1{font-weight:900;letter-spacing:-.02em;line-height:1.05}
.foot{position:absolute;left:0;right:0;bottom:0;background:var(--tinta);color:#fff;display:flex;
align-items:center;justify-content:space-between;padding:0 64px;font-size:26px}
.foot b{color:#FDBA74}
.pill{background:var(--grad);color:#fff;font-weight:700;border-radius:999px;box-shadow:0 8px 24px rgba(234,88,12,.3)}

html,body{width:1080px;height:1350px}
.num{position:absolute;right:56px;top:56px;font-size:22px;font-weight:700;color:var(--gris);letter-spacing:.08em}
.lg{position:absolute;left:56px;top:48px;height:50px}
.swipe{position:absolute;right:56px;bottom:52px;font-size:26px;font-weight:700;color:var(--n7)}
.eyebrow{font-size:24px;font-weight:700;letter-spacing:.08em;color:var(--n7);text-transform:uppercase}

.b{position:absolute;left:56px;top:140px;width:968px}
.b h1{font-size:88px;letter-spacing:-.035em;line-height:1.02}
.chat{position:absolute;left:40px;right:40px;top:470px;bottom:110px;background:#fff;border:1px solid var(--borde);
border-radius:32px;box-shadow:0 16px 40px rgba(26,26,26,.10);display:flex;flex-direction:column;overflow:hidden}
.ch{display:flex;align-items:center;gap:16px;padding:16px 28px;border-bottom:1px solid #EFE7E1;background:var(--crema)}
.ch b{display:block;font-size:26px}.ch span{font-size:20px;color:#16A34A}
.av.sm{width:52px;height:52px;padding:8px}
.msgs{flex:1;padding:22px 28px;display:flex;flex-direction:column;justify-content:space-between}
.m{display:flex;align-items:flex-end;gap:14px}
.m.out{justify-content:flex-end}
.av{flex:none;width:64px;height:64px;border-radius:50%;object-fit:contain;background:var(--durazno);padding:10px}
.av.tu{display:flex;align-items:center;justify-content:center;background:#E7E2DD;color:var(--gris);font-weight:700;font-size:22px;padding:0}
.bb{max-width:760px;font-size:36px;line-height:1.2;padding:22px 30px;border-radius:30px}
.in .bb{background:#F1ECE8;color:var(--tinta);border-bottom-left-radius:8px}
.out .bb{background:var(--grad);color:#fff;font-weight:700;border-bottom-right-radius:8px;box-shadow:0 8px 24px rgba(234,88,12,.25)}
.out .bb b{font-weight:900;background:#fff;color:var(--n6);border-radius:10px;padding:0 10px}
</style></head><body><div class='num'>1/8</div><img class='lg' src='fotos/logo-horizontal.png'><div class='swipe'>Desliza →</div><div class='b'><h1>Ya no tienes <span class='grad'>excusa</span> para no empezar tu negocio.</h1></div><div class='chat'><div class='ch'><img class='av sm' src='fotos/icono.png'><div><b>Compra en fábricas</b><span>en línea</span></div></div><div class='msgs'><div class='m in'><div class='av tu'>Tú</div><div class='bb'>No tengo capital para empezar</div></div>
<div class='m out'><div class='bb'>10 piezas desde <b>$1,574</b></div><img class='av' src='fotos/icono.png'></div><div class='m in'><div class='av tu'>Tú</div><div class='bb'>Importar de China es complicado</div></div>
<div class='m out'><div class='bb'>Ya están en México. Tú solo eliges</div><img class='av' src='fotos/icono.png'></div><div class='m in'><div class='av tu'>Tú</div><div class='bb'>Tarda meses en llegar</div></div>
<div class='m out'><div class='bb'>Te llega por DHL al día hábil siguiente</div><img class='av' src='fotos/icono.png'></div></div></div></body></html>
