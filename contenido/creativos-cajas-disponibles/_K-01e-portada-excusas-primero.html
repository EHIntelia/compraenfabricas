<!doctype html><html lang='es'><head><meta charset='utf-8'><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#F97316;--n6:#EA580C;--n7:#C2410C;--n9:#9A3412;--tinta:#1A1A1A;--gris:#6B6B6B;
--durazno:#FFEDD5;--crema:#FFF8F5;--borde:#D9CFC7;--grad:linear-gradient(90deg,#F97316,#EA580C)}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:Arial,"Liberation Sans",Helvetica,sans-serif;color:var(--tinta);background:var(--crema)}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{display:inline-block;background:var(--grad);color:#fff;font-weight:700;letter-spacing:.08em;
text-transform:uppercase;border-radius:999px}
.badge.soft{background:var(--durazno);color:var(--n7)}
.flag{width:1.15em;height:.77em;border-radius:3px;vertical-align:-.04em;margin-left:.2em}
.photo{background-size:auto 100%;background-position:center;background-repeat:no-repeat;background-color:#3a3a3a}
.logo{display:block}
h1{font-weight:900;letter-spacing:-.02em;line-height:1.05}
.foot{position:absolute;left:0;right:0;bottom:0;background:var(--tinta);color:#fff;display:flex;
align-items:center;justify-content:space-between;padding:0 64px;font-size:26px}
.foot b{color:#FDBA74}
.pill{background:var(--grad);color:#fff;font-weight:700;border-radius:999px;box-shadow:0 8px 24px rgba(234,88,12,.3)}

html,body{width:1080px;height:1350px}
.num{position:absolute;right:56px;top:56px;font-size:22px;font-weight:700;color:var(--gris);letter-spacing:.08em}
.lg{position:absolute;left:56px;top:48px;height:50px}
.swipe{position:absolute;right:56px;bottom:52px;font-size:26px;font-weight:700;color:var(--n7)}
.eyebrow{font-size:24px;font-weight:700;letter-spacing:.08em;color:var(--n7);text-transform:uppercase}

.top{position:absolute;left:0;right:0;top:0;height:760px;background:var(--durazno)}
.lg{z-index:2}.num{z-index:2}
.lab{position:absolute;left:64px;top:180px;font-size:26px;font-weight:700;letter-spacing:.1em;color:var(--n9)}
.xs{position:absolute;left:64px;right:64px;top:250px;display:flex;flex-direction:column;gap:34px}
.x{align-self:flex-start;font-size:84px;font-weight:900;letter-spacing:-.03em;color:#8A817B;position:relative;line-height:1.05}
.x::after{content:"";position:absolute;left:-12px;right:-12px;top:50%;height:12px;border-radius:6px;background:var(--n6);transform:rotate(-3deg)}
.bot{position:absolute;left:64px;right:64px;top:810px}
.bot h1{font-size:136px;letter-spacing:-.04em;line-height:.98}
.oks{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.oks span{background:#fff;border:2px solid var(--n);color:var(--n7);font-weight:700;font-size:27px;border-radius:999px;padding:10px 22px}
</style></head><body><div class='num'>1/8</div><img class='lg' src='fotos/logo-horizontal.png'><div class='swipe'>Desliza →</div><div class='top'></div><div class='lab'>TUS EXCUSAS PARA EMPEZAR UN NEGOCIO:</div><div class='xs'><div class='x'>No tengo capital</div><div class='x'>Importar es complicado</div><div class='x'>Tarda meses en llegar</div></div>
<div class='bot'><h1>Ya no <span class='grad'>aplican.</span></h1><div class='oks'><span>✓ 10 piezas desde $1,574</span><span>✓ Ya están en México</span><span>✓ DHL al día hábil siguiente</span></div></div></body></html>
