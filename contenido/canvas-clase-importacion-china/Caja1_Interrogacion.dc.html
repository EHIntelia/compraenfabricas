<style>
body{margin:0}
.k1-stage{perspective:1800px}
.k1-float{animation:k1float 3s ease-in-out infinite alternate}
.k1-cube{position:relative;width:380px;height:380px;transform-style:preserve-3d;animation:k1spin 9s linear infinite}
.k1-f{position:absolute;inset:0;box-sizing:border-box;border:12px solid #1A1A1A;border-radius:8px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;font-family:Arial, Helvetica, sans-serif;font-weight:900;font-size:270px;line-height:1;color:#FFFFFF;text-shadow:10px 10px 0 #1A1A1A}
.k1-front{transform:translateZ(190px)}
.k1-back{transform:rotateY(180deg) translateZ(190px)}
.k1-right{transform:rotateY(90deg) translateZ(190px)}
.k1-left{transform:rotateY(-90deg) translateZ(190px)}
.k1-top{transform:rotateX(90deg) translateZ(190px)}
.k1-bottom{transform:rotateX(-90deg) translateZ(190px)}
.k1-spark{position:absolute;animation:k1tw 2.4s ease-in-out infinite both}
.k1-q{position:absolute;animation:k1pop 4.5s ease-out infinite both}
@keyframes k1spin{from{transform:rotateX(-20deg) rotateY(0deg)}to{transform:rotateX(-20deg) rotateY(360deg)}}
@keyframes k1float{from{transform:translateY(-26px)}to{transform:translateY(26px)}}
@keyframes k1tw{0%{transform:scale(0) rotate(0deg)}30%{transform:scale(1) rotate(45deg)}60%{transform:scale(0) rotate(90deg)}100%{transform:scale(0) rotate(90deg)}}
@keyframes k1pop{0%{transform:scale(0) rotate(-20deg)}12%{transform:scale(1.15) rotate(8deg)}18%{transform:scale(1) rotate(0deg)}70%{transform:scale(1) rotate(0deg)}80%{transform:scale(0) rotate(0deg)}100%{transform:scale(0)}}
@media (prefers-reduced-motion: reduce){.k1-cube{animation:none;transform:rotateX(-20deg) rotateY(-35deg)}.k1-float,.k1-spark,.k1-q{animation:none}}
</style>
</helmet>
