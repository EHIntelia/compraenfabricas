<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Comenta Curso · A animado con textos chroma</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.top{animation:topIn 6s ease-out infinite both}
@keyframes topIn{0%{transform:scale(0)}5%{transform:scale(1.08)}8%{transform:scale(1)}93%{transform:scale(1)}100%{transform:scale(0)}}
.arrow{animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
.card{animation:cardIn 6s ease-out infinite both}
@keyframes cardIn{0%{transform:scale(0)}8.33%{transform:scale(0)}13.33%{transform:scale(1.05)}16.67%{transform:scale(1)}93%{transform:scale(1)}100%{transform:scale(0)}}
.word{display:inline-block;transform-origin:0 70%;animation:wordIn 6s ease-out infinite both}
@keyframes wordIn{0%{transform:scale(0)}18.33%{transform:scale(0)}23.33%{transform:scale(1.12)}26.67%{transform:scale(1)}100%{transform:scale(1)}}
.heart{position:relative;width:52px;height:52px}
.h-off,.h-on{position:absolute;left:0;top:0}
.h-on{animation:hOn 6s ease-out infinite both}
@keyframes hOn{0%{transform:scale(0)}36.67%{transform:scale(0)}40.67%{transform:scale(1.4)}44.67%{transform:scale(1)}100%{transform:scale(1)}}
.n1,.n2{animation:6s steps(1,end) infinite both}
.n1{animation-name:nOut}.n2{animation-name:nIn}
@keyframes nOut{0%{font-size:24px}40.67%{font-size:0}100%{font-size:0}}
@keyframes nIn{0%{font-size:0}40.67%{font-size:24px}100%{font-size:24px}}
.bot{animation:botIn 6s ease-out infinite both}
@keyframes botIn{0%{transform:scale(0)}50%{transform:scale(0)}55%{transform:scale(1.06)}58.33%{transform:scale(1)}93%{transform:scale(1)}100%{transform:scale(0)}}
@media (prefers-reduced-motion: reduce){.top,.arrow,.card,.word,.h-on,.n1,.n2,.bot{animation:none}.n1{font-size:0}}
</style>
</helmet>
<div class="root ck" style="background: #00FF00; width: 1080px; height: 640px; box-sizing: border-box; padding: 40px 90px; font-family: Arial, Helvetica, sans-serif; color: #1A1A1A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">
<div class="top" style="display: inline-flex; align-items: center; gap: 14px; padding: 16px 32px; border-radius: 999px; background: linear-gradient(90deg,#F97316,#DC2626); color: #FFFFFF; font-size: 34px; font-weight: 900; letter-spacing: 0.08em">
<span>COMENTA</span>
<svg class="arrow" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M19 12l-7 7-7-7"></path></svg>
</div>
<div class="card" style="width: 100%; box-sizing: border-box; background: #FFFFFF; border-radius: 32px; padding: 36px 40px; display: flex; gap: 28px; align-items: flex-start">
<div style="flex: 0 0 96px; height: 96px; border-radius: 50%; background: #FCE4DC; color: #DC2626; display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 900">MA</div>
<div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; gap: 14px; align-items: baseline">
<span style="font-size: 30px; font-weight: 700; color: #1A1A1A">maria.importa</span>
<span style="font-size: 26px; color: #6B6B6B">hace 1 min</span>
</div>
<div style="font-size: 84px; font-weight: 900; line-height: 1.05; letter-spacing: -0.02em"><span class="word">Curso</span></div>
<div style="font-size: 26px; font-weight: 700; color: #6B6B6B; margin-top: 6px">Responder</div>
</div>
<div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 40px">
<div class="heart">
<svg class="h-off" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
<svg class="h-on" width="52" height="52" viewBox="0 0 24 24" fill="#DC2626" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
</div>
<span style="font-weight: 700; color: #6B6B6B; line-height: 1.2"><span class="n1">1,1 mil</span><span class="n2">1,2 mil</span></span>
</div>
</div>
<div class="bot" style="background: #1A1A1A; color: #FFFFFF; border-radius: 999px; padding: 16px 32px; font-size: 30px; font-weight: 700">y te mando la liga por mensaje</div>
</div>
</x-dc>
