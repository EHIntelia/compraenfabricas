<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:110px}.chip{height:72px;border-radius:12px;border:1px solid var(--cef-borde)}.lb{font-size:13px;font-weight:700;margin-top:8px}.hx{font-size:12px;color:var(--cef-gris);font-family:monospace}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:13px"><div style="display:flex;gap:10px;align-items:center"><span style="width:32px;height:32px;border-radius:8px;border:1px solid var(--cef-borde);background:var(--text-primary)"></span><div><b>Texto</b><div class="hx">--text-primary</div></div></div><div style="display:flex;gap:10px;align-items:center"><span style="width:32px;height:32px;border-radius:8px;border:1px solid var(--cef-borde);background:var(--text-secondary)"></span><div><b>Texto 2</b><div class="hx">--text-secondary</div></div></div><div style="display:flex;gap:10px;align-items:center"><span style="width:32px;height:32px;border-radius:8px;border:1px solid var(--cef-borde);background:var(--text-highlight)"></span><div><b>Destacado</b><div class="hx">--text-highlight</div></div></div><div style="display:flex;gap:10px;align-items:center"><span style="width:32px;height:32px;border-radius:8px;border:1px solid var(--cef-borde);background:var(--surface-page)"></span><div><b>Página</b><div class="hx">--surface-page</div></div></div><div style="display:flex;gap:10px;align-items:center"><span style="width:32px;height:32px;border-radius:8px;border:1px solid var(--cef-borde);background:var(--surface-badge)"></span><div><b>Badge</b><div class="hx">--surface-badge</div></div></div><div style="display:flex;gap:10px;align-items:center"><span style="width:32px;height:32px;border-radius:8px;border:1px solid var(--cef-borde);background:var(--border-default)"></span><div><b>Borde</b><div class="hx">--border-default</div></div></div></div></body></html>
