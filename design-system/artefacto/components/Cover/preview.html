<!-- @dsCard height=336 -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Compra en Fábricas Design System</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface-page); color:var(--text-primary); font-family:var(--font-display); overflow:hidden; }
  .cover { position:relative; height:336px; overflow:hidden; background:var(--surface-page); }
  /* the top band: blocks and pills across the full 960 width, clear of the name */
  .band { position:absolute; top:0; left:0; width:960px; height:96px; overflow:hidden; }
  .band svg { display:block; width:960px; height:96px; }
  .naranja { fill:var(--cef-naranja); }
  .naranja-oscuro { fill:var(--cef-naranja-600, #ea580c); }
  .durazno { fill:var(--cef-durazno); }
  .tinta { fill:var(--cef-tinta); }
  .crema { fill:var(--cef-crema); }
  .blk { rx:var(--radius-xl); }
  /* a space-5-tall pill: rx = half its height = radius-md */
  .pill { rx:var(--radius-md); }
  .words { position:absolute; left:var(--space-7); right:var(--space-7); bottom:var(--space-7); }
  .name { margin:0; font-size:64px; line-height:.95; font-weight:var(--fw-black); letter-spacing:var(--ls-tight); color:var(--text-primary); }
  .tag { margin:var(--space-4) 0 0; font-family:var(--font-sans); font-size:14px; line-height:20px; color:var(--text-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 96" width="960" height="96">
<!--
  blocks      cef-naranja 384×96 · cef-naranja-600 192×96 · cef-durazno 96×96 (the one tint) · cef-tinta 288×96 bleeding off the right edge; all bled off the top by space-5 · about 29% of 960×336
  arrangement one strip of unequal bands across the top (the name is too wide for the 440px zone), naranja then naranja oscuro left to right like the degradado estrella, durazno for relief, tinta last
  pattern     pills, from "Radii: soft … pill (buttons, badges)": badge-height pills at a space-6 row pitch, naranja on durazno and tinta, crema cut out of the naranja · 12 units
  scales      block widths in space-9 multiples (4, 2, 1, 3); gaps space-2; pill gaps space-4; pills space-5 tall in space-6 to space-8 widths; corners radius-xl; pill rx radius-md
-->
<rect class="naranja blk" x="0" y="-24" width="384" height="120" rx="24"/>
<rect class="naranja-oscuro blk" x="392" y="-24" width="192" height="120" rx="24"/>
<rect class="durazno blk" x="592" y="-24" width="96" height="120" rx="24"/>
<rect class="tinta blk" x="696" y="-24" width="288" height="120" rx="24"/>
<rect class="crema pill" x="240" y="24" width="64" height="24" rx="12"/>
<rect class="crema pill" x="320" y="24" width="32" height="24" rx="12"/>
<rect class="crema pill" x="256" y="56" width="32" height="24" rx="12"/>
<rect class="crema pill" x="304" y="56" width="64" height="24" rx="12"/>
<rect class="naranja pill" x="616" y="24" width="48" height="24" rx="12"/>
<rect class="naranja pill" x="624" y="56" width="32" height="24" rx="12"/>
<rect class="naranja pill" x="728" y="24" width="64" height="24" rx="12"/>
<rect class="naranja pill" x="808" y="24" width="32" height="24" rx="12"/>
<rect class="naranja pill" x="856" y="24" width="64" height="24" rx="12"/>
<rect class="naranja pill" x="744" y="56" width="32" height="24" rx="12"/>
<rect class="naranja pill" x="792" y="56" width="64" height="24" rx="12"/>
<rect class="naranja pill" x="872" y="56" width="32" height="24" rx="12"/>
</svg>
</div>
<div class="words">
<h1 class="name">Compra en Fábricas<br>Design System</h1>
<p class="tag">Aprende a comprar directo en fábricas de China 🇨🇳</p>
</div>
</div>
</body>
</html>
